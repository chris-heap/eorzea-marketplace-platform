eorzea_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "eorzea.duckdb"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "localhost:9000"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin"
        s3_use_ssl: false
        s3_url_style: "path"
    bigquery:
      type: bigquery
      method: service-account
      project: eorzea-market
      dataset: eorzea_marketplace_01
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      timeout_seconds: 300
      location: northamerica-northeast2
    docker:
      type: duckdb
      path: "/opt/airflow/dbt/eorzea_docker.duckdb"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin"
        s3_use_ssl: false
        s3_url_style: "path"