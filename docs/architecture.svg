<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Eorzea Market Platform Architecture</title>
  <desc>Data flows from Universalis API through ingestion, storage, transformation, and into an LLM-powered serving layer with observability</desc>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c8aa6e"/>
    </marker>
  </defs>

  <!-- Universalis — gold -->
  <rect x="120" y="15" width="160" height="50" rx="8" fill="#c8aa6e" stroke="#dfc68a" stroke-width="1.5"/>
  <text x="200" y="37" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Universalis API</text>
  <text x="200" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#3a2a0e" text-anchor="middle">WebSocket + REST</text>

  <line x1="200" y1="65" x2="200" y2="95" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Producer — steel blue -->
  <rect x="120" y="95" width="160" height="50" rx="8" fill="#2a5a8a" stroke="#4a8abf" stroke-width="1.5"/>
  <text x="200" y="117" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">Producer</text>
  <text x="200" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Python WS consumer</text>

  <line x1="200" y1="145" x2="200" y2="175" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Kafka — warm amber -->
  <rect x="120" y="175" width="160" height="45" rx="8" fill="#8a5a2a" stroke="#bf8a4a" stroke-width="1.5"/>
  <text x="200" y="202" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">Kafka</text>

  <line x1="200" y1="220" x2="200" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Airflow wrapper -->
  <rect x="30" y="245" width="370" height="285" rx="12" fill="none" stroke="#bf8a4a" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="50" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#bf8a4a" letter-spacing="0.5">Airflow — Orchestration</text>

  <!-- Flink — magenta -->
  <rect x="120" y="280" width="160" height="45" rx="8" fill="#7a2a5a" stroke="#bf4a8a" stroke-width="1.5"/>
  <text x="200" y="307" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">Flink</text>

  <line x1="200" y1="325" x2="200" y2="355" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- MinIO — teal -->
  <rect x="120" y="355" width="160" height="50" rx="8" fill="#2a6a6a" stroke="#4aaaaa" stroke-width="1.5"/>
  <text x="200" y="377" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">MinIO (S3)</text>
  <text x="200" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Hudi parquet tables</text>

  <line x1="200" y1="405" x2="200" y2="435" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- dbt — forest green -->
  <rect x="120" y="435" width="160" height="45" rx="8" fill="#2a6a3a" stroke="#4aaa6a" stroke-width="1.5"/>
  <text x="200" y="462" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">dbt</text>

  <!-- Arrows from dbt to BigQuery and DuckDB -->
  <line x1="170" y1="480" x2="120" y2="555" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="230" y1="480" x2="280" y2="555" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- BigQuery — Google blue -->
  <rect x="40" y="555" width="150" height="45" rx="8" fill="#1a4a8a" stroke="#4285F4" stroke-width="1.5"/>
  <text x="115" y="582" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">BigQuery</text>

  <!-- DuckDB — yellow-green -->
  <rect x="210" y="555" width="150" height="45" rx="8" fill="#4a6a1a" stroke="#7aaa3a" stroke-width="1.5"/>
  <text x="285" y="582" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">DuckDB</text>

  <!-- Arrow from DuckDB to FastAPI -->
  <path d="M 340 555 Q 420 480 470 377" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- FastAPI — indigo -->
  <rect x="470" y="355" width="190" height="45" rx="8" fill="#3a3a7a" stroke="#6a6abf" stroke-width="1.5"/>
  <text x="565" y="382" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">FastAPI + LangChain</text>

  <!-- LLM Tools — dark with gold border -->
  <rect x="490" y="270" width="160" height="55" rx="8" fill="#1e1e32" stroke="#c8aa6e" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="570" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8aa6e" text-anchor="middle">LLM Tools</text>
  <text x="570" y="304" font-family="system-ui, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Universalis | XIVAPI</text>
  <text x="570" y="316" font-family="system-ui, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Lodestone | DuckDB search</text>

  <line x1="565" y1="355" x2="565" y2="325" stroke="#c8aa6e" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Frontend — gold -->
  <rect x="490" y="190" width="160" height="45" rx="8" fill="#c8aa6e" stroke="#dfc68a" stroke-width="1.5"/>
  <text x="570" y="217" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Frontend (React)</text>

  <line x1="565" y1="270" x2="565" y2="235" stroke="#c8aa6e" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- OpenTelemetry — crimson -->
  <rect x="470" y="430" width="190" height="45" rx="8" fill="#7a2a2a" stroke="#bf4a4a" stroke-width="1.5"/>
  <text x="565" y="457" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">OpenTelemetry</text>

  <line x1="565" y1="400" x2="565" y2="430" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Grafana — deep orange -->
  <rect x="490" y="505" width="160" height="45" rx="8" fill="#8a4a1a" stroke="#d4782a" stroke-width="1.5"/>
  <text x="570" y="532" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">Grafana</text>

  <line x1="565" y1="475" x2="565" y2="505" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>

</svg>
