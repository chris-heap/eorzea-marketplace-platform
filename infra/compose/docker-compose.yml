services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
  jobmanager:
    image: flink:1.16-scala_2.12-java11
    container_name: jobmanager
    ports:
      - 8081:8081
    command: bash -c "cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/lib/ && /docker-entrypoint.sh jobmanager"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      HADOOP_CONF_DIR: /opt/flink/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      - ./jars/hudi-flink1.16-bundle-0.13.1.jar:/opt/flink/lib/hudi-flink1.16-bundle-0.13.1.jar
      - ./core-site.xml:/opt/flink/conf/core-site.xml
  taskmanager:
    image: flink:1.16-scala_2.12-java11
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: bash -c "cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/lib/ && /docker-entrypoint.sh taskmanager"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      HADOOP_CONF_DIR: /opt/flink/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2048m
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      - ./jars/hudi-flink1.16-bundle-0.13.1.jar:/opt/flink/lib/hudi-flink1.16-bundle-0.13.1.jar
      - ./core-site.xml:/opt/flink/conf/core-site.xml
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - 9000:9000   # S3 API
      - 9001:9001   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  ws-producer:
    build:
      context: ../../producer
      dockerfile: Dockerfile
    container_name: ws-producer
    depends_on:
      - broker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    restart: unless-stopped
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
  airflow:
    image: apache/airflow:2.10.5-python3.11
    container_name: airflow
    depends_on:
      - airflow-postgres
      - minio
      - jobmanager
    ports:
      - 8080:8080
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-duckdb duckdb"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../dbt/eorzea_analytics:/opt/airflow/dbt
      - airflow_duckdb:/opt/airflow/dbt_output
      - ../../flink/target/scala-2.12:/opt/airflow/flink-jars
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null; airflow webserver & airflow scheduler"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  minio_data:
  airflow_pg_data:
  airflow_duckdb:
  kafka_data: