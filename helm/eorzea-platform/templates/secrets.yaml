apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    release: {{ .Release.Name }}
type: Opaque
data:
  # Set via: helm install --set-string secrets.anthropicApiKey=<your-key>
  # The key must be base64-encoded
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | default "" | b64enc | quote }}
