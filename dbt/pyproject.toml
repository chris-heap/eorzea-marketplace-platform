[project]
name = "eorzea-analytics"
version = "0.1.0"
description = "dbt transformations for Eorzea market data"
authors = [
    {name = "Christopher Skowronski", email = "cskowronski44@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "dbt-duckdb (>=1.9.0,<2.0.0)",
    "duckdb (>=1.0.0,<2.0.0)",
    "streamlit (>=1.30.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
