[project]
name = "eorzea-api"
version = "0.1.0"
description = "FastAPI + LangChain serving layer for Eorzea market analytics"
authors = [
    {name = "Christopher Skowronski", email = "cskowronski44@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.136.0,<1.0.0)",
    "uvicorn (>=0.30.0,<1.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
    "langchain-anthropic (>=1.2.0,<2.0.0)",
    "duckdb (>=1.0.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "beautifulsoup4 (>=4.12.0,<5.0.0)",
    "opentelemetry-api (>=1.27.0,<2.0.0)",
    "opentelemetry-sdk (>=1.27.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.48b0,<1.0.0)",
    "opentelemetry-exporter-prometheus (>=0.48b0,<1.0.0)",
    "prometheus-client (>=0.21.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
