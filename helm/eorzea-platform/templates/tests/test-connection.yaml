apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-api"
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: busybox
      command: ['wget', '--spider', '-q']
      args: ['http://{{ .Release.Name }}-api:{{ .Values.api.port }}/health']
  restartPolicy: Never
